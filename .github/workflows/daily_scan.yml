name: Daily Stock Signal Scanner

on:
  schedule:
    # 10:45 UTC is 4:15 PM IST. Market closes at 3:30 PM IST, and daily data updates.
    - cron: '45 10 * * 1-5'
  workflow_dispatch: # Allows manual trigger
  push:
    branches: [main]
    paths:
      - 'docs/**'           # republish the dashboard when the UI changes
      - 'build_dashboard.py'
      - '.github/workflows/daily_scan.yml'

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    # Skip the market scan on a docs-only push; just rebuild and redeploy the site.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Daily Stock Scanner
      env:
        NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      run: python daily_scanner.py

    - name: Rebuild Dashboard Payload
      run: python build_dashboard.py

    - name: Commit State and Dashboard Data
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add active_trades.json trade_history.json scan_log.json docs/data/dashboard_data.json
        if git diff --cached --quiet; then
          echo "No changes to commit."
        else
          git commit -m "Auto-update trades and dashboard [skip ci]"
          # Another run may have pushed in the meantime.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
        fi

  deploy:
    needs: [scan]
    # Deploy after a scan, and also on a docs-only push where `scan` is skipped.
    if: always() && (needs.scan.result == 'success' || needs.scan.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Checkout latest main
      uses: actions/checkout@v4
      with:
        # The scan job just pushed a commit; grab that, not the triggering SHA.
        ref: main

    # `enablement` needs a token with admin rights. If PAGES_TOKEN is not set this
    # falls back to GITHUB_TOKEN, which cannot enable Pages, so the step is allowed
    # to fail and the next step explains what to do.
    - name: Configure Pages
      id: pages
      continue-on-error: true
      uses: actions/configure-pages@v5
      with:
        enablement: true
        token: ${{ secrets.PAGES_TOKEN || github.token }}

    - name: Explain Pages setup if not enabled
      if: steps.pages.outcome == 'failure'
      run: |
        {
          echo "## GitHub Pages is not enabled"
          echo
          echo "The dashboard was built but could not be published."
          echo
          echo "**Fix it once:** open **Settings → Pages** and set **Source** to **GitHub Actions**."
          echo "Re-run this workflow afterwards and the site goes live at"
          echo "\`https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/\`."
        } >> "$GITHUB_STEP_SUMMARY"
        echo "::error::GitHub Pages is not enabled. Set Settings > Pages > Source to 'GitHub Actions'."
        exit 1

    - name: Upload dashboard
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

    - name: Summarise deployment
      run: |
        {
          echo "## Dashboard published"
          echo
          echo "${{ steps.deployment.outputs.page_url }}"
        } >> "$GITHUB_STEP_SUMMARY"
